<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0F172A' />
      <stop offset='50%' stop-color='#1E3A8A' />
      <stop offset='100%' stop-color='#1D4ED8' />
    </linearGradient>

    <!-- Ball Base Gradient -->
    <radialGradient id='ballGrad' cx='35%' cy='32%' r='68%'>
      <stop offset='0%' stop-color='#FACC15' />
      <stop offset='35%' stop-color='#CCFF00' />
      <stop offset='75%' stop-color='#84CC16' />
      <stop offset='100%' stop-color='#4D7C0F' />
    </radialGradient>

    <!-- Subtle Glow/Shadow Filter -->
    <filter id='dropShadow' x='-20%' y='-20%' width='150%' height='150%'>
      <feDropShadow dx='0' dy='16' stdDeviation='20' flood-color='#000000' flood-opacity='0.45' />
    </filter>

    <filter id='seamGlow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='2' stdDeviation='2' flood-color='#000000' flood-opacity='0.2' />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width='512' height='512' rx='112' fill='url(#bgGrad)' />

  <!-- Stadium Court Subtle Lines -->
  <path d='M0 256 H512' stroke='rgba(255,255,255,0.08)' stroke-width='4' stroke-dasharray='12 8' />
  <circle cx='256' cy='256' r='210' fill='none' stroke='rgba(255,255,255,0.06)' stroke-width='4' />

  <!-- Tennis Ball with Drop Shadow -->
  <g filter='url(#dropShadow)'>
    <!-- Ball Body -->
    <circle cx='256' cy='256' r='148' fill='url(#ballGrad)' />

    <!-- Tennis Ball Seams (Clipped to ball) -->
    <g clip-path='url(#ballClip)'>
      <!-- Seam 1 (Left curved seam) -->
      <path d='M 152 140 C 235 180, 235 332, 152 372' 
            fill='none' 
            stroke='#FFFFFF' 
            stroke-width='14' 
            stroke-linecap='round' 
            filter='url(#seamGlow)' />

      <!-- Seam 2 (Right curved seam) -->
      <path d='M 360 140 C 277 180, 277 332, 360 372' 
            fill='none' 
            stroke='#FFFFFF' 
            stroke-width='14' 
            stroke-linecap='round' 
            filter='url(#seamGlow)' />
    </g>

    <!-- Clip Path for Seams -->
    <clipPath id='ballClip'>
      <circle cx='256' cy='256' r='148' />
    </clipPath>

    <!-- Ball Top Specular Highlight -->
    <ellipse cx='215' cy='180' rx='55' ry='32' fill='rgba(255,255,255,0.32)' transform='rotate(-25 215 180)' />
  </g>

  <!-- Subtle Tennis Racquet Ring Accent -->
  <circle cx='256' cy='256' r='182' fill='none' stroke='rgba(204,255,0,0.22)' stroke-width='3' stroke-dasharray='6 6' />
</svg>