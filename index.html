<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TennisPlaner" />
    <meta name="application-name" content="Tennis Trainingsplaner" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#DC2626" />
    <title>Tennis Trainingsplaner | Montagsrunde</title>
    <!-- Immediate Theme Initialization to eliminate color flash on refresh -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tennis_app_theme');
          var primary = '#DC2626';
          var container = '#FEE2E2';
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.primary) {
              primary = parsed.primary;
              container = parsed.primaryContainer || (parsed.primary + '20');
            }
          }
          document.documentElement.style.setProperty('--club-primary', primary);
          document.documentElement.style.setProperty('--club-primary-container', container);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', primary);
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts & Material Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 antialiased font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
